<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Brain Voice"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Brain Voice Messenger</title><style>:root{--ink:#10151b;--paper:#f5f4ef;--signal:#e85d38;--quiet:#69737a;--line:#ced2ce;--card:#fffefa;--shadow:0 16px 44px rgba(16,21,27,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}main{width:min(100%,680px);margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}.eyebrow{margin:0 0 8px;color:var(--signal);font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.title{margin:0;font-size:clamp(2rem,9vw,3.6rem);line-height:.95;letter-spacing:-.065em}.intro{margin:16px 0 28px;max-width:36rem;color:var(--quiet);font-size:1rem}.card{padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--shadow)}label{display:block;font-size:.86rem;font-weight:750;margin-bottom:8px}textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);font:inherit}textarea{min-height:185px;padding:14px;resize:vertical;font-size:1.05rem;line-height:1.45}select{height:44px;padding:0 12px}.controls{display:grid;gap:16px;margin-top:18px}.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.range-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:.78rem}.range-label span{color:var(--quiet);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--signal)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{min-height:50px;border:0;border-radius:999px;padding:0 20px;font:inherit;font-weight:800;cursor:pointer;transition:transform .12s ease,opacity .12s ease}button:active{transform:scale(.98)}.speak{background:var(--ink);color:white}.stop{background:#e7e7e1;color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.46}.status{min-height:22px;margin:16px 2px 0;color:var(--quiet);font-size:.9rem}.install{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--quiet);font-size:.85rem}.install strong{color:var(--ink)}.unsupported{color:#ad311d}@media(max-width:440px){main{padding-left:14px;padding-right:14px}.sliders{grid-template-columns:1fr}.card{padding:14px}.title{font-size:2.45rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><p class="eyebrow">Speak it clearly</p><h1 class="title">Brain Voice<br>Messenger</h1><p class="intro">Write a message. Tap speak. Your phone says it out loud.</p><section class="card" aria-label="Voice message composer"><label for="message">What do you want to say?</label><textarea id="message" placeholder="Type your message here…" autofocus></textarea><div class="controls"><div><label for="voice">Voice</label><select id="voice"><option>Loading available voices…</option></select></div><div class="sliders"><div><div class="range-label"><label for="speed">Speed</label><span id="speedValue">1.0×</span></div><input id="speed" type="range" min="0.6" max="1.6" step="0.1" value="1"></div><div><div class="range-label"><label for="pitch">Pitch</label><span id="pitchValue">1.0</span></div><input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="1"></div><div><div class="range-label"><label for="volume">Volume</label><span id="volumeValue">100%</span></div><input id="volume" type="range" min="0" max="1" step="0.05" value="1"></div></div></div><div class="actions"><button id="speak" class="speak" type="button">Speak aloud</button><button id="stop" class="stop" type="button" disabled>Stop</button></div><p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p><p class="install"><strong>Install on iPhone:</strong> open this page in Safari, tap Share, then choose <strong>Add to Home Screen</strong>. On Android, open Chrome’s menu and choose <strong>Install app</strong>.</p></section></main><script>const supported='speechSynthesis'in window,$=id=>document.getElementById(id),message=$('message'),voice=$('voice'),speak=$('speak'),stop=$('stop'),status=$('status'),speed=$('speed'),pitch=$('pitch'),volume=$('volume');let voices=[];function setStatus(text,error=false){status.textContent=text;status.className='status'+(error?' unsupported':'')}function loadVoices(){voices=window.speechSynthesis.getVoices();voice.innerHTML='';if(!voices.length){voice.innerHTML='<option>Phone default voice</option>';return}const preferred=voices.find(v=>/^en/i.test(v.lang))||voices[0];voices.forEach((item,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${item.name} · ${item.lang}`;if(item===preferred)option.selected=true;voice.appendChild(option)})}function readValues(){$('speedValue').textContent=Number(speed.value).toFixed(1)+'×';$('pitchValue').textContent=Number(pitch.value).toFixed(1);$('volumeValue').textContent=Math.round(Number(volume.value)*100)+'%'}[speed,pitch,volume].forEach(control=>control.addEventListener('input',readValues));readValues();if(!supported){speak.disabled=true;setStatus('This browser cannot speak messages. Try a current version of Safari or Chrome.',true)}else{loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}speak.addEventListener('click',()=>{const text=message.value.trim();if(!text){setStatus('Type a message first.',true);message.focus();return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text),selected=voices[Number(voice.value)];if(selected)utterance.voice=selected;utterance.rate=Number(speed.value);utterance.pitch=Number(pitch.value);utterance.volume=Number(volume.value);utterance.onstart=()=>{speak.disabled=true;stop.disabled=false;setStatus('Speaking aloud…')};utterance.onend=()=>{speak.disabled=false;stop.disabled=true;setStatus('Finished speaking.')};utterance.onerror=e=>{speak.disabled=false;stop.disabled=true;setStatus(e.error==='canceled'?'Stopped.':'Could not speak this message.',e.error!=='canceled')};window.speechSynthesis.speak(utterance)});stop.addEventListener('click',()=>{window.speechSynthesis.cancel();speak.disabled=false;stop.disabled=true;setStatus('Stopped.')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
